<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razorpay Secure Store</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 30px;
      color: #333;
    }
    .store-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .product-card {
      width: 280px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product-name {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 1.5rem;
      color: #3399cc;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #3399cc;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #287ba8;
    }
    #status {
      margin-top: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      max-width: 600px;
    }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
    .info { color: #1565c0; }
  </style>
</head>
<body>

  <h1>My Developer Store</h1>

  <div class="store-container">
    <!-- Product 1 -->
    <div class="product-card">
      <div class="product-name">JavaScript E-Book</div>
      <div class="product-price">₹299</div>
      <button class="buy-btn" data-product="prod_ebook">Buy E-Book</button>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
      <div class="product-name">Fullstack Mastery</div>
      <div class="product-price">₹1499</div>
      <button class="buy-btn" data-product="prod_course">Buy Course</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const WORKER_URL = "https://rough-frost-0867.anishdey0602.workers.dev/";
    const RAZORPAY_KEY_ID = "rzp_test_TCdvMJSoFybix6";

    const buyButtons = document.querySelectorAll(".buy-btn");
    const statusBox = document.getElementById("status");

    function setStatus(msg, type = "info") {
      statusBox.className = type; 
      statusBox.innerHTML = msg;
    }

    function toggleButtons(disable) {
      buyButtons.forEach(btn => btn.disabled = disable);
    }

    // Attach click events to all buy buttons
    buyButtons.forEach(button => {
      button.addEventListener("click", () => {
        const productId = button.getAttribute("data-product");
        processPaymentFlow(productId, button);
      });
    });

    async function processPaymentFlow(productId, clickedButton) {
      if (typeof Razorpay === "undefined") {
        setStatus("Razorpay failed to load. Check internet connection.", "error");
        return;
      }

      toggleButtons(true);
      const originalText = clickedButton.innerText;
      clickedButton.innerText = "Processing...";
      setStatus("Creating order securely on server...", "info");

      try {
        // 1. Send ONLY the Product ID to the backend
        const orderResponse = await fetch(WORKER_URL + "create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId: productId })
        });

        const order = await orderResponse.json();

        if (!orderResponse.ok || !order.id) {
          throw new Error(order.error || "Failed to create order on server.");
        }

        setStatus("Order created. Awaiting payment...", "info");

        // 2. Initialize Checkout (Amount is strictly what the server returned)
        const options = {
          key: RAZORPAY_KEY_ID,
          amount: order.amount,
          currency: order.currency,
          name: "My Developer Store",
          description: `Payment for ${order.notes.productName}`,
          order_id: order.id,
          prefill: { name: "Test User" },
          theme: { color: "#3399cc" },
          
          handler: async function (response) {
            setStatus("Payment captured! Verifying cryptographic signature...", "info");
            
            try {
              // 3. Verify Payment
              const verifyResponse = await fetch(WORKER_URL + "verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature
                })
              });

              const verifyResult = await verifyResponse.json();

              if (verifyResult.success) {
                setStatus(
                  `🎉 Success! Thank you for purchasing.<br><small>Order ID: ${response.razorpay_order_id}</small>`, 
                  "success"
                );
              } else {
                throw new Error(verifyResult.error || "Signature verification failed!");
              }

            } catch (verifyError) {
              console.error(verifyError);
              setStatus("Verification failed: " + verifyError.message, "error");
            } finally {
              toggleButtons(false);
              clickedButton.innerText = originalText;
            }
          },
          modal: {
            ondismiss: function () {
              setStatus("Payment window closed by user.", "error");
              toggleButtons(false);
              clickedButton.innerText = originalText;
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.on("payment.failed", function (response) {
          setStatus("Transaction failed: " + response.error.description, "error");
          toggleButtons(false);
          clickedButton.innerText = originalText;
        });
        rzp.open();

      } catch (error) {
        console.error("Payment Flow Error:", error);
        setStatus(error.message, "error");
        toggleButtons(false);
        clickedButton.innerText = originalText;
      }
    }
  </script>
</body>
</html>
