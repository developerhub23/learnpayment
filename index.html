<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razorpay ₹1 Test Payment</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }
    body{
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      width:360px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,.15);
    }
    h1{ margin-bottom:15px; }
    p{
      margin-bottom:20px;
      color:#555;
    }
    button{
      width:100%;
      padding:15px;
      font-size:18px;
      border:none;
      border-radius:10px;
      background:#3399cc;
      color:#fff;
      cursor:pointer;
    }
    button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }
    #status{
      margin-top:18px;
      color:green;
      word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>₹1 Test Payment</h1>
    <p>Click below to pay ₹1 using Razorpay Test Mode.</p>

    <button id="payBtn" disabled>Loading...</button>
    <div id="status"></div>
  </div>

  <script>
    const WORKER_URL = "https://rough-frost-0867.anishdey0602.workers.dev/";
    const RAZORPAY_KEY_ID = "rzp_test_TCdvMJSoFybix6";

    const payBtn = document.getElementById("payBtn");
    const statusBox = document.getElementById("status");

    function setStatus(msg, isError = false) {
      statusBox.style.color = isError ? "crimson" : "green";
      statusBox.innerHTML = msg;
    }

    window.addEventListener("load", () => {
      if (typeof Razorpay === "undefined") {
        setStatus("Razorpay Checkout failed to load.", true);
        payBtn.disabled = true;
        payBtn.innerText = "Unavailable";
        return;
      }

      payBtn.disabled = false;
      payBtn.innerText = "Pay ₹1";
      setStatus("");
    });

    payBtn.addEventListener("click", payNow);

    async function payNow() {
      payBtn.disabled = true;
      payBtn.innerText = "Please Wait...";
      setStatus("Creating Razorpay order...");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Worker HTTP error: " + response.status);
        }

        const order = await response.json();
        console.log("Order received:", order);

        if (!order || !order.id) {
          throw new Error("Invalid order response from backend.");
        }

        const options = {
          key: RAZORPAY_KEY_ID,
          amount: order.amount,
          currency: order.currency,
          name: "My Demo Website",
          description: "₹1 Test Payment",
          order_id: order.id,
          prefill: {
            name: "Rishi"
          },
          theme: {
            color: "#3399cc"
          },
          handler: function (response) {
            console.log("Payment success:", response);
            setStatus(
              "<b>Payment Successful</b><br><br>" +
              "Payment ID:<br>" + response.razorpay_payment_id
            );
          },
          modal: {
            ondismiss: function () {
              setStatus("Payment cancelled.", true);
            }
          }
        };

        const rzp = new Razorpay(options);

        rzp.on("payment.failed", function (response) {
          console.error("Payment failed:", response.error);
          setStatus("Payment failed.", true);
        });

        rzp.open();
      } catch (error) {
        console.error(error);
        setStatus(error.message, true);
        alert(error.message);
      } finally {
        payBtn.disabled = false;
        payBtn.innerText = "Pay ₹1";
      }
    }
  </script>
</body>
</html>
